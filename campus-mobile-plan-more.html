<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <meta name="theme-color" content="#f6f7fb">
  <title>UniDock | 更多校园流量卡套餐</title>
  <link rel="icon" href="./favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/unidock-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/unidock-32.png">
  <link rel="apple-touch-icon" href="./icons/unidock-256.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages.css">
  <link rel="stylesheet" href="./assets/css/animations.css">
  <link rel="stylesheet" href="./assets/css/nav.css">
</head>
<body data-page="mobilePlanMore">
  <div class="site-background" aria-hidden="true">
    <div class="site-background__mesh"></div>
    <div class="site-background__orb site-background__orb--one"></div>
    <div class="site-background__orb site-background__orb--two"></div>
    <div class="site-background__orb site-background__orb--three"></div>
  </div>

  <header class="site-header">
    <div class="container site-header__inner">
      <div class="subpage-header__group">
        <a class="subpage-back" href="./campus-mobile-plan.html">
          <span aria-hidden="true">←</span>
          <span data-i18n="mobilePlanMorePage.contact.back">返回校园流量卡</span>
        </a>
        <a class="brand" href="./index.html" aria-label="UniDock">
          <img class="brand__mark" src="./icons/unidock-144.png" alt="UniDock" width="30" height="30">
          <span class="brand__text">
            <strong>UniDock</strong>
            <span data-i18n="header.subline">NUIST Freshman Hub</span>
          </span>
        </a>
      </div>

      <div class="lang-switch" data-i18n-aria-label="header.languageLabel" aria-label="语言切换">
        <svg class="lang-switch__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3Z" />
          <path d="M4.5 9H19.5" />
          <path d="M4.5 15H19.5" />
          <path d="M12 3C14.2386 5.18991 15.5 8.07785 15.5 12C15.5 15.9221 14.2386 18.8101 12 21C9.76142 18.8101 8.5 15.9221 8.5 12C8.5 8.07785 9.76142 5.18991 12 3Z" />
        </svg>
        <div class="lang-switch__buttons">
          <button class="lang-switch__button is-active" type="button" data-lang-switch="zh">中</button>
          <button class="lang-switch__button" type="button" data-lang-switch="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main class="subpage-main">
    <section class="section section--compact">
      <div class="container">
        <div class="detail-shell">
          <section class="detail-intro" data-reveal>
            <span class="eyebrow" data-i18n="mobilePlanMorePage.hero.eyebrow">更多套餐</span>
            <h1 data-i18n="mobilePlanMorePage.hero.title">更多校园流量卡套餐</h1>
            <p data-i18n="mobilePlanMorePage.hero.subtitle">如需获取更多套餐、办理细则、发货 / 限制地区等信息，请联系负责人确认。</p>
          </section>

          <section class="cta-banner" data-reveal data-delay="40">
            <div class="cta-banner__copy">
              <span class="eyebrow" data-i18n="mobilePlanMorePage.contact.eyebrow">联系负责人</span>
              <h2 data-i18n="mobilePlanMorePage.contact.title">联系负责人获取更多套餐信息</h2>
              <p data-i18n="mobilePlanMorePage.contact.desc">如需获取更多套餐、办理细则、发货 / 限制地区等信息，请直接联系本站负责人确认。</p>
            </div>
            <a class="button button--primary button--wide" href="./wechat-add.html" data-i18n="mobilePlanMorePage.contact.button">联系负责人</a>
          </section>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <div class="site-footer__brand">
        <img class="brand__mark brand__mark--footer" src="./icons/unidock-144.png" alt="UniDock" width="36" height="36">
        <div class="site-footer__copy">
          <strong>UniDock</strong>
          <p data-i18n="footer.desc">为 NUIST 新生整理信息入口、校园资源与联系支持。</p>
        </div>
      </div>
      <a class="site-footer__contact" href="./wechat-add.html" data-i18n="footer.contactButton">联系我们</a>
    </div>
  </footer>

  <script src="./assets/js/mailbox.js" defer></script>
  <script src="./assets/js/nav.js" defer></script>
  <script src="./assets/js/language.js" defer></script>
  <script src="./assets/js/main.js" defer></script>

</html>
